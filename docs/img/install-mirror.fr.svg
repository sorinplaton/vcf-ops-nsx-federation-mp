<text x="28" y="512" font-size="13.5" font-weight="600" fill="#18212b">Flux réseau, tous en TCP 443. Chaque flèche part du système qui ouvre la connexion. Traits pleins : l&#x27;hôte de copie. Pointillés : le proxy cloud.</text>
<circle cx="40" cy="544" r="11" fill="#18212b"/><text x="40" y="548.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="548.5" font-size="12.8" fill="#18212b">Pack, clé, clone.</text>
<circle cx="40" cy="571" r="11" fill="#18212b"/><text x="40" y="575.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="575.5" font-size="12.8" fill="#18212b">Copier l&#x27;image par son digest.</text>
<circle cx="40" cy="598" r="11" fill="#18212b"/><text x="40" y="602.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="602.5" font-size="12.8" fill="#18212b">Journal de transparence.</text>
<circle cx="40" cy="625" r="11" fill="#18212b"/><text x="40" y="629.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="629.5" font-size="12.8" fill="#18212b">Push de l&#x27;image.</text>
<circle cx="40" cy="652" r="11" fill="#18212b"/><text x="40" y="656.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="656.5" font-size="12.8" fill="#18212b">Installer le pack réécrit (étape 6).</text>
<circle cx="40" cy="679" r="11" fill="#18212b"/><text x="40" y="683.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="60" y="683.5" font-size="12.8" fill="#18212b">Le proxy cloud récupère l&#x27;image.</text>
<circle cx="40" cy="706" r="11" fill="#18212b"/><text x="40" y="710.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="60" y="710.5" font-size="12.8" fill="#18212b">Collecte.</text>
