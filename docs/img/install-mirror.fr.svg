<path d="M729,370 L729,320" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="729.0" cy="345.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="729.0" y="349.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
