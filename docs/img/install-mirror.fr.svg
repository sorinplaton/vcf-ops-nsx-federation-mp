<rect x="624" y="370" width="210" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="624" y="370" width="6" height="66" rx="3" fill="#57478c"/><text x="644" y="398" font-size="17" font-weight="600" fill="#18212b">Proxy cloud</text><text x="644" y="418" font-size="12.5" fill="#5a6675">sans accès à Internet</text>
