<path d="M554,163 L624,163" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="589.0" cy="163.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="589.0" y="167.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M344,403 L160,403 L160,356" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="252.0" cy="403.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="252.0" y="407.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M554,403 L970,403 L970,316" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="762.0" cy="403.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="762.0" y="407.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="28" y="512" font-size="13.5" font-weight="600" fill="#18212b">Flux réseau, tous en TCP 443. Chaque flèche part du système qui ouvre la connexion. Traits pleins : le poste d&#x27;administration. Pointillés : le proxy</text>
<text x="28" y="532" font-size="13.5" font-weight="600" fill="#18212b">cloud.</text>
<circle cx="40" cy="564" r="11" fill="#18212b"/><text x="40" y="568.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="568.5" font-size="12.8" fill="#18212b">Pack, somme de contrôle, bundle, clé.</text>
<circle cx="40" cy="591" r="11" fill="#18212b"/><text x="40" y="595.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="595.5" font-size="12.8" fill="#18212b">Vérifier la signature de l&#x27;image.</text>
<circle cx="40" cy="618" r="11" fill="#18212b"/><text x="40" y="622.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="622.5" font-size="12.8" fill="#18212b">Journal de transparence.</text>
<circle cx="40" cy="645" r="11" fill="#18212b"/><text x="40" y="649.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="649.5" font-size="12.8" fill="#18212b">Installer le pack, créer le compte (étapes 6 à 10).</text>
<circle cx="40" cy="672" r="11" fill="#18212b"/><text x="40" y="676.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="676.5" font-size="12.8" fill="#18212b">Le proxy cloud récupère l&#x27;image par son digest.</text>
<circle cx="40" cy="699" r="11" fill="#18212b"/><text x="40" y="703.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="60" y="703.5" font-size="12.8" fill="#18212b">Collecte.</text>
</svg>
