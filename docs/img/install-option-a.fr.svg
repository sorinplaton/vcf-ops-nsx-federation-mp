<rect width="1100" height="740" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">Option A : flux réseau du poste d&#x27;administration et du proxy cloud</text>
<rect x="24" y="62" width="276" height="418" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="40" y="88" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">INTERNET</text>
<rect x="320" y="62" width="756" height="418" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="336" y="88" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">RÉSEAU DE L&#x27;ORGANISATION</text>
<rect x="40" y="110" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="129" font-size="12.3" fill="#18212b" font-weight="600" >github.com</text><text x="50" y="145" font-size="12.3" fill="#5a6675"  >page des versions, cosign.pub</text>
<rect x="40" y="190" width="240" height="62" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="209" font-size="12.3" fill="#18212b" font-weight="600" >Sigstore</text><text x="50" y="225" font-size="12.3" fill="#5a6675"  >tuf-repo-cdn.sigstore.dev</text><text x="50" y="241" font-size="12.3" fill="#5a6675"  >rekor.sigstore.dev</text>
<rect x="40" y="290" width="240" height="62" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="309" font-size="12.3" fill="#18212b" font-weight="600" >ghcr.io</text><text x="50" y="325" font-size="12.3" fill="#5a6675"  >pkg-containers.githubusercontent.com</text><text x="50" y="341" font-size="12.3" fill="#5a6675"  >image de l&#x27;adaptateur et sa signature</text>
<rect x="344" y="110" width="210" height="226" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="344" y="110" width="6" height="226" rx="3" fill="#1e7a50"/><text x="364" y="138" font-size="17" font-weight="600" fill="#18212b">Poste d&#x27;administration</text><text x="364" y="158" font-size="12.5" fill="#5a6675">navigateur, cosign</text>
<rect x="624" y="130" width="210" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="624" y="130" width="6" height="66" rx="3" fill="#57478c"/><text x="644" y="158" font-size="17" font-weight="600" fill="#18212b">VCF Operations</text><text x="644" y="178" font-size="12.5" fill="#5a6675">console d&#x27;administration,</text><text x="644" y="194" font-size="12.5" fill="#5a6675">interface du produit</text>
<rect x="344" y="370" width="210" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="344" y="370" width="6" height="66" rx="3" fill="#57478c"/><text x="364" y="398" font-size="17" font-weight="600" fill="#18212b">Proxy cloud</text>
<rect x="880" y="130" width="180" height="186" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="880" y="130" width="6" height="186" rx="3" fill="#1e7a50"/><text x="900" y="158" font-size="17" font-weight="600" fill="#18212b">NSX</text>
<text x="900" y="192" font-size="12.5" font-weight="600" fill="#18212b">Global Managers</text><text x="900" y="209" font-size="11.5" fill="#5a6675">actif et standby</text><text x="900" y="258" font-size="12.5" font-weight="600" fill="#18212b">Local Managers</text><text x="900" y="275" font-size="11.5" fill="#5a6675">un par emplacement</text>
<path d="M344,133 L284,133" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="314.0" cy="133.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="314.0" y="137.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M344,321 L284,321" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="314.0" cy="321.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="314.0" y="325.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
