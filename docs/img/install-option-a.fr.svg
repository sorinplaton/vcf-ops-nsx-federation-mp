<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Option A : flux réseau du poste d&#x27;administration et du proxy cloud">
