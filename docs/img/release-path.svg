<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 584" width="1100" height="584" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="From a Git tag to a published release">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1100" height="584" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">From a Git tag to a published release</text>
<rect x="40" y="110" width="200" height="66" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="40" y="110" width="6" height="66" rx="3" fill="#1e7a50"/><text x="60" y="138" font-size="17" font-weight="600" fill="#18212b">Maintainer</text><text x="60" y="158" font-size="12.5" fill="#5a6675">commit, tag, push</text>
<rect x="300" y="110" width="200" height="66" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="300" y="110" width="6" height="66" rx="3" fill="#0b5cad"/><text x="320" y="138" font-size="17" font-weight="600" fill="#18212b">Tag v1.x.y</text><text x="320" y="158" font-size="12.5" fill="#5a6675">on GitHub</text>
<rect x="560" y="96" width="230" height="94" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="560" y="96" width="6" height="94" rx="3" fill="#0b5cad"/><text x="580" y="124" font-size="17" font-weight="600" fill="#18212b">release.yml</text><text x="580" y="144" font-size="12.5" fill="#5a6675">mp-build, pack image,</text><text x="580" y="160" font-size="12.5" fill="#5a6675">keyless signatures, SBOM</text>
<rect x="850" y="70" width="226" height="66" rx="10" fill="#ffffff" stroke="#9a5b00" stroke-width="2"/><rect x="850" y="70" width="6" height="66" rx="3" fill="#9a5b00"/><text x="870" y="98" font-size="17" font-weight="600" fill="#18212b">ghcr.io/sorinplaton</text><text x="870" y="118" font-size="12.5" fill="#5a6675">nsxfederation, nsxfederation-pak</text>
<rect x="850" y="160" width="226" height="66" rx="10" fill="#ffffff" stroke="#9a5b00" stroke-width="2"/><rect x="850" y="160" width="6" height="66" rx="3" fill="#9a5b00"/><text x="870" y="188" font-size="17" font-weight="600" fill="#18212b">docker.io/sorinplaton</text><text x="870" y="208" font-size="12.5" fill="#5a6675">nsxfederation, nsxfederation-pak</text>
<rect x="560" y="270" width="230" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="560" y="270" width="6" height="66" rx="3" fill="#57478c"/><text x="580" y="298" font-size="17" font-weight="600" fill="#18212b">Draft GitHub release</text>
<rect x="850" y="270" width="226" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="850" y="270" width="6" height="66" rx="3" fill="#57478c"/><text x="870" y="298" font-size="17" font-weight="600" fill="#18212b">Published release</text>
<path d="M240,143 L296,143" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="268.0" cy="143.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="268.0" y="147.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M500,143 L556,143" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="528.0" cy="143.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="528.0" y="147.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M790,114 L846,114" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="818.0" cy="114.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="818.0" y="118.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M790,176 L846,176" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="818.0" cy="176.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="818.0" y="180.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M675,190 L675,266" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="675.0" cy="228.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="675.0" y="232.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M790,303 L846,303" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="818.0" cy="303.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="818.0" y="307.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="28" y="376" font-size="13.5" font-weight="600" fill="#18212b">Release path.</text>
<circle cx="40" cy="408" r="11" fill="#18212b"/><text x="40" y="412.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="412.5" font-size="12.8" fill="#18212b">The maintainer commits, tags and pushes.</text>
<circle cx="40" cy="435" r="11" fill="#18212b"/><text x="40" y="439.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="439.5" font-size="12.8" fill="#18212b">The tag starts release.yml: mp-build, pack image, keyless signatures, SBOM.</text>
<circle cx="40" cy="462" r="11" fill="#18212b"/><text x="40" y="466.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="466.5" font-size="12.8" fill="#18212b">The workflow pushes both images to ghcr.io.</text>
<circle cx="40" cy="489" r="11" fill="#18212b"/><text x="40" y="493.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="493.5" font-size="12.8" fill="#18212b">The workflow copies both images byte for byte to Docker Hub.</text>
<circle cx="40" cy="516" r="11" fill="#18212b"/><text x="40" y="520.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="520.5" font-size="12.8" fill="#18212b">The workflow creates a draft GitHub release.</text>
<circle cx="40" cy="543" r="11" fill="#18212b"/><text x="40" y="547.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="60" y="547.5" font-size="12.8" fill="#18212b">The maintainer checks the draft, adds the key signatures (transition) and publishes.</text>
</svg>
