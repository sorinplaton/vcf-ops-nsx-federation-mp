<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 716" width="1100" height="716" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="NSX Federation pack: what talks to what">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18212b"/></marker></defs>
<rect width="1100" height="716" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">NSX Federation pack: what talks to what</text>
<rect x="24" y="62" width="276" height="398" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="40" y="88" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">INTERNET</text>
<rect x="320" y="62" width="756" height="398" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="336" y="88" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">YOUR ORGANISATION</text>
<rect x="40" y="150" width="244" height="136" rx="10" fill="#ffffff" stroke="#9a5b00" stroke-width="2"/><rect x="40" y="150" width="6" height="136" rx="3" fill="#9a5b00"/><text x="60" y="178" font-size="17" font-weight="600" fill="#18212b">Docker Hub</text>
<rect x="54" y="190" width="222" height="30" rx="6" fill="#f3f6fa" stroke="#c9d1db"/><text x="64" y="209" font-size="11.8" fill="#18212b" font-family="ui-monospace,Menlo,Consolas,monospace">sorinplaton/nsxfederation-pak</text>
<rect x="54" y="228" width="222" height="30" rx="6" fill="#f3f6fa" stroke="#c9d1db"/><text x="64" y="247" font-size="11.8" fill="#18212b" font-family="ui-monospace,Menlo,Consolas,monospace">sorinplaton/nsxfederation</text>
<rect x="344" y="112" width="250" height="196" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="344" y="112" width="6" height="196" rx="3" fill="#0b5cad"/><text x="364" y="140" font-size="17" font-weight="600" fill="#18212b">Artifactory</text>
<rect x="362" y="154" width="214" height="30" rx="6" fill="#f3f6fa" stroke="#c9d1db"/><text x="372" y="173" font-size="12.5" fill="#18212b" >Docker Hub remote repository</text>
<rect x="362" y="196" width="214" height="44" rx="6" fill="#f3f6fa" stroke="#c9d1db"/><text x="372" y="215" font-size="12.5" fill="#18212b" >Approved repository</text><text x="372" y="232" font-size="12" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">vcfops-approved</text>
<path d="M469,184 L469,194" stroke="#5a6675" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="344" y="372" width="250" height="66" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="344" y="372" width="6" height="66" rx="3" fill="#1e7a50"/><text x="364" y="400" font-size="17" font-weight="600" fill="#18212b">Linux host</text><text x="364" y="420" font-size="12.5" fill="#5a6675">Docker, python3, repack.py</text>
<rect x="664" y="372" width="220" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="664" y="372" width="6" height="66" rx="3" fill="#57478c"/><text x="684" y="400" font-size="17" font-weight="600" fill="#18212b">VCF Operations</text><text x="684" y="420" font-size="12.5" fill="#5a6675">admin console, product UI</text>
<rect x="664" y="150" width="220" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="664" y="150" width="6" height="66" rx="3" fill="#57478c"/><text x="684" y="178" font-size="17" font-weight="600" fill="#18212b">Cloud proxy</text><text x="684" y="198" font-size="12.5" fill="#5a6675">runs the adapter container</text>
<rect x="916" y="112" width="146" height="196" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="916" y="112" width="6" height="196" rx="3" fill="#1e7a50"/><text x="936" y="140" font-size="17" font-weight="600" fill="#18212b">NSX</text>
<text x="936" y="170" font-size="12.5" font-weight="600" fill="#18212b">Global Managers</text><text x="936" y="187" font-size="11.5" fill="#5a6675">active and standby</text>
<text x="936" y="240" font-size="12.5" font-weight="600" fill="#18212b">Local Managers</text><text x="936" y="257" font-size="11.5" fill="#5a6675">one per location</text>
<path d="M344,172 L288,172" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)" /><circle cx="316" cy="150" r="12" fill="#18212b"/><text x="316" y="154.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M469,372 L469,312" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)" /><circle cx="492" cy="342" r="12" fill="#18212b"/><text x="492" y="346.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M664,200 L598,200" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)" /><circle cx="631" cy="178" r="12" fill="#18212b"/><text x="631" y="182.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M594,405 L660,405" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)" /><circle cx="627" cy="383" r="12" fill="#18212b"/><text x="627" y="387.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M774,368 L774,220" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" marker-start="url(#b)"/><circle cx="797" cy="294" r="12" fill="#18212b"/><text x="797" y="298.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M884,183 L912,183" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)" /><circle cx="898" cy="161" r="12" fill="#18212b"/><text x="898" y="165.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="28" y="492" font-size="13.5" font-weight="600" fill="#18212b">Network flows. Each arrow starts at the system that opens the connection. Flows 1 to 4 and 6 use TCP 443.</text>
<circle cx="40" cy="520" r="11" fill="#18212b"/><text x="40" y="524.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="60" y="524.5" font-size="12.8" fill="#18212b">Artifactory pulls both images from Docker Hub (before this guide).</text>
<circle cx="40" cy="547" r="11" fill="#18212b"/><text x="40" y="551.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="60" y="551.5" font-size="12.8" fill="#18212b">The Linux host pulls the pack image and takes the .pak file out (steps 1 and 2).</text>
<circle cx="40" cy="574" r="11" fill="#18212b"/><text x="40" y="578.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="60" y="578.5" font-size="12.8" fill="#18212b">Each cloud proxy pulls the adapter image by digest, without a login (step 3).</text>
<circle cx="40" cy="601" r="11" fill="#18212b"/><text x="40" y="605.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="60" y="605.5" font-size="12.8" fill="#18212b">From the Linux host or a workstation, the administrator uploads the rewritten pack and creates the account (steps 4 and 5).</text>
<circle cx="40" cy="628" r="11" fill="#18212b"/><text x="40" y="632.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="60" y="632.5" font-size="12.8" fill="#18212b">VCF Operations and the cloud proxy use their existing collector link. Nothing to open.</text>
<circle cx="40" cy="655" r="11" fill="#18212b"/><text x="40" y="659.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="60" y="659.5" font-size="12.8" fill="#18212b">The adapter reads the Global Managers and the Local Managers, read-only (step 6).</text>
<path d="M28,690 L72,690" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5"/><text x="82" y="694" font-size="12.5" fill="#5a6675">existing link of the platform</text>
</svg>
