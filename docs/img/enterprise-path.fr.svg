<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Comment une version arrive dans l&#x27;organisation">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1180" height="720" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">Comment une version arrive dans l&#x27;organisation</text>
<rect x="24" y="62" width="246" height="418" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="40" y="88" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">GITHUB : RÉFÉRENCE</text>
<rect x="290" y="62" width="270" height="418" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="306" y="88" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">DOCKER HUB</text>
<rect x="580" y="62" width="576" height="418" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="596" y="88" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">ORGANISATION</text>
<rect x="40" y="110" width="214" height="50" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="40" y="110" width="6" height="50" rx="3" fill="#0b5cad"/><text x="60" y="138" font-size="17" font-weight="600" fill="#18212b">Tag Git v1.x.y</text>
<rect x="40" y="200" width="214" height="66" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="40" y="200" width="6" height="66" rx="3" fill="#0b5cad"/><text x="60" y="228" font-size="17" font-weight="600" fill="#18212b">Workflow de version</text><text x="60" y="248" font-size="12.5" fill="#5a6675">build, push, signature</text>
<rect x="40" y="310" width="214" height="66" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="40" y="310" width="6" height="66" rx="3" fill="#0b5cad"/><text x="60" y="338" font-size="17" font-weight="600" fill="#18212b">Version GitHub</text><text x="60" y="358" font-size="12.5" fill="#5a6675">.pak, somme de contrôle, SBOM</text>
<path d="M147,160 L147,196" fill="none" stroke="#5a6675" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M147,266 L147,306" fill="none" stroke="#5a6675" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="306" y="170" width="244" height="156" rx="10" fill="#ffffff" stroke="#9a5b00" stroke-width="2"/><rect x="306" y="170" width="6" height="156" rx="3" fill="#9a5b00"/><text x="326" y="198" font-size="17" font-weight="600" fill="#18212b">Docker Hub</text>
<rect x="318" y="208" width="222" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="328" y="227" font-size="11.8" fill="#18212b"  font-family="ui-monospace,Menlo,Consolas,monospace">sorinplaton/nsxfederation-pak</text><text x="328" y="243" font-size="12.3" fill="#5a6675"  >le .pak dans une image</text>
<rect x="318" y="264" width="222" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="328" y="283" font-size="11.8" fill="#18212b"  font-family="ui-monospace,Menlo,Consolas,monospace">sorinplaton/nsxfederation</text><text x="328" y="299" font-size="12.3" fill="#5a6675"  >image de l&#x27;adaptateur</text>
<rect x="604" y="130" width="260" height="206" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="604" y="130" width="6" height="206" rx="3" fill="#0b5cad"/><text x="624" y="158" font-size="17" font-weight="600" fill="#18212b">Artifactory</text>
<rect x="620" y="172" width="228" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="630" y="191" font-size="12.3" fill="#18212b" font-weight="600" >Dépôt distant Docker Hub</text><text x="630" y="207" font-size="12.3" fill="#5a6675"  >cache, non utilisé par la production</text>
<rect x="620" y="240" width="228" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="630" y="259" font-size="11.8" fill="#18212b"  font-family="ui-monospace,Menlo,Consolas,monospace">vcfops-approved</text><text x="630" y="275" font-size="12.3" fill="#5a6675"  >dépôt local</text>
<rect x="604" y="390" width="260" height="66" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="604" y="390" width="6" height="66" rx="3" fill="#1e7a50"/><text x="624" y="418" font-size="17" font-weight="600" fill="#18212b">Hôte de promotion</text><text x="624" y="438" font-size="12.5" fill="#5a6675">vérifier, analyser, copier, réécrire</text>
<rect x="930" y="390" width="206" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="930" y="390" width="6" height="66" rx="3" fill="#57478c"/><text x="950" y="418" font-size="17" font-weight="600" fill="#18212b">VCF Operations</text>
<rect x="930" y="230" width="206" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="930" y="230" width="6" height="66" rx="3" fill="#57478c"/><text x="950" y="258" font-size="17" font-weight="600" fill="#18212b">Proxy cloud</text>
<path d="M254,233 L302,233" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="278.0" cy="233.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="278.0" y="237.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M604,195 L554,195" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="579.0" cy="195.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="579.0" y="199.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M670,390 L670,340" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="670.0" cy="365.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="670.0" y="369.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M800,390 L800,340" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="800.0" cy="365.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="800.0" y="369.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M864,423 L926,423" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="895.0" cy="423.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="895.0" y="427.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M930,263 L868,263" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="899.0" cy="263.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="899.0" y="267.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="28" y="512" font-size="13.5" font-weight="600" fill="#18212b">Chaque flèche part du système qui ouvre la connexion. Traits pleins : publication et promotion. Pointillés : le proxy cloud.</text>
<circle cx="40" cy="544" r="11" fill="#18212b"/><text x="40" y="548.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="548.5" font-size="12.8" fill="#18212b">Le workflow de publication fait le push des deux images sur Docker Hub, avec le même digest que sur ghcr.io.</text>
<circle cx="40" cy="571" r="11" fill="#18212b"/><text x="40" y="575.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="575.5" font-size="12.8" fill="#18212b">Artifactory les récupère par son dépôt distant Docker Hub.</text>
<circle cx="40" cy="598" r="11" fill="#18212b"/><text x="40" y="602.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="602.5" font-size="12.8" fill="#18212b">L&#x27;hôte de promotion récupère par tag, puis par digest, vérifie la signature et analyse.</text>
<circle cx="40" cy="625" r="11" fill="#18212b"/><text x="40" y="629.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="629.5" font-size="12.8" fill="#18212b">L&#x27;hôte de promotion copie par digest dans vcfops-approved.</text>
<circle cx="40" cy="652" r="11" fill="#18212b"/><text x="40" y="656.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="656.5" font-size="12.8" fill="#18212b">L&#x27;hôte de promotion installe le pack réécrit.</text>
<circle cx="40" cy="679" r="11" fill="#18212b"/><text x="40" y="683.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="60" y="683.5" font-size="12.8" fill="#18212b">Le proxy cloud récupère l&#x27;image de l&#x27;adaptateur par son digest.</text>
</svg>
