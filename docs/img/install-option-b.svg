<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 793" width="1100" height="793" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Option B: network flows of the build host and of the cloud proxy">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1100" height="793" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">Option B: network flows of the build host and of the cloud proxy</text>
<rect x="24" y="62" width="276" height="418" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="40" y="88" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">INTERNET</text>
<rect x="320" y="62" width="756" height="418" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="336" y="88" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">YOUR NETWORK</text>
<rect x="40" y="100" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="119" font-size="12.3" fill="#18212b" font-weight="600" >download.docker.com, dl.google.com</text><text x="50" y="135" font-size="12.3" fill="#5a6675"  >distribution repositories</text>
<rect x="40" y="154" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="173" font-size="12.3" fill="#18212b" font-weight="600" >github.com</text><text x="50" y="189" font-size="12.3" fill="#5a6675"  >clone, govc download</text>
<rect x="40" y="208" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="227" font-size="12.3" fill="#18212b" font-weight="600" >Docker Hub</text><text x="50" y="243" font-size="12.3" fill="#5a6675"  >registry-1.docker.io</text>
<rect x="40" y="262" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="281" font-size="12.3" fill="#18212b" font-weight="600" >pypi.org</text><text x="50" y="297" font-size="12.3" fill="#5a6675"  >files.pythonhosted.org</text>
<rect x="40" y="316" width="240" height="46" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="335" font-size="12.3" fill="#18212b" font-weight="600" >cgr.dev</text><text x="50" y="351" font-size="12.3" fill="#5a6675"  >Wolfi base and packages</text>
<path d="M290,100 L296,100 L296,362 L290,362" fill="none" stroke="#5a6675" stroke-width="1.6"/>
<rect x="40" y="384" width="240" height="62" rx="6" fill="#ffffff" stroke="#c9d1db"/><text x="50" y="403" font-size="12.3" fill="#18212b" font-weight="600" >ghcr.io</text><text x="50" y="419" font-size="12.3" fill="#5a6675"  >pkg-containers.githubusercontent.com</text><text x="50" y="435" font-size="12.3" fill="#5a6675"  >released image</text>
<rect x="344" y="130" width="210" height="66" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="344" y="130" width="6" height="66" rx="3" fill="#1e7a50"/><text x="364" y="158" font-size="17" font-weight="600" fill="#18212b">Build host</text><text x="364" y="178" font-size="12.5" fill="#5a6675">(jump host)</text>
<rect x="624" y="130" width="210" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="624" y="130" width="6" height="66" rx="3" fill="#57478c"/><text x="644" y="158" font-size="17" font-weight="600" fill="#18212b">VCF Operations</text><text x="644" y="178" font-size="12.5" fill="#5a6675">admin console, Suite API</text>
<rect x="624" y="250" width="210" height="66" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="624" y="250" width="6" height="66" rx="3" fill="#0b5cad"/><text x="644" y="278" font-size="17" font-weight="600" fill="#18212b">vCenter, ESXi host</text><text x="644" y="298" font-size="12.5" fill="#5a6675">of the cloud proxy VM</text>
<rect x="344" y="370" width="210" height="66" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2"/><rect x="344" y="370" width="6" height="66" rx="3" fill="#0b5cad"/><text x="364" y="398" font-size="17" font-weight="600" fill="#18212b">Registry</text><text x="364" y="418" font-size="12.5" fill="#5a6675">HTTPS</text>
<rect x="624" y="370" width="210" height="66" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2"/><rect x="624" y="370" width="6" height="66" rx="3" fill="#57478c"/><text x="644" y="398" font-size="17" font-weight="600" fill="#18212b">Cloud proxy</text>
<rect x="880" y="130" width="180" height="186" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="880" y="130" width="6" height="186" rx="3" fill="#1e7a50"/><text x="900" y="158" font-size="17" font-weight="600" fill="#18212b">NSX</text>
<text x="900" y="192" font-size="12.5" font-weight="600" fill="#18212b">Global Managers</text><text x="900" y="209" font-size="11.5" fill="#5a6675">active and standby</text><text x="900" y="258" font-size="12.5" font-weight="600" fill="#18212b">Local Managers</text><text x="900" y="275" font-size="11.5" fill="#5a6675">one per location</text>
<path d="M344,163 L300,163" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="322.0" cy="163.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="322.0" y="167.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M420,196 L420,370" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="420.0" cy="283.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="420.0" y="287.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M554,150 L624,150" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="589.0" cy="150.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="589.0" y="154.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M500,196 L500,283 L624,283" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="562.0" cy="283.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="562.0" y="287.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M500,130 L500,106 L970,106 L970,130" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="735.0" cy="106.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="735.0" y="110.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<path d="M624,403 L554,403" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="589.0" cy="403.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="589.0" y="407.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<path d="M729,436 L729,462 L160,462 L160,446" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="444.5" cy="462.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="444.5" y="466.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<path d="M834,403 L970,403 L970,316" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="902.0" cy="403.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="902.0" y="407.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="28" y="512" font-size="13.5" font-weight="600" fill="#18212b">Network flows. Each arrow starts at the system that opens the connection. Solid: the build host. Dashed: the cloud proxy.</text>
<circle cx="40" cy="544" r="11" fill="#18212b"/><text x="40" y="548.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="548.5" font-size="12.8" fill="#18212b">TCP 443 to the internet: Docker, Chrome, git, Python and Node.js packages; the clone (github.com); base images (Docker Hub); SDK and adapter packages (PyPI);</text>
<text x="60" y="567.5" font-size="12.8" fill="#18212b">the Wolfi base of the adapter image (cgr.dev).</text>
<circle cx="40" cy="590" r="11" fill="#18212b"/><text x="40" y="594.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="594.5" font-size="12.8" fill="#18212b">TCP 5000: push the image (step 3).</text>
<circle cx="40" cy="617" r="11" fill="#18212b"/><text x="40" y="621.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="621.5" font-size="12.8" fill="#18212b">TCP 443: upload the pack, account, scripts (steps 6-10).</text>
<circle cx="40" cy="644" r="11" fill="#18212b"/><text x="40" y="648.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="648.5" font-size="12.8" fill="#18212b">TCP 443: govc to vCenter, and govc guest.upload to the ESXi host of the cloud proxy VM (step 4).</text>
<circle cx="40" cy="671" r="11" fill="#18212b"/><text x="40" y="675.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="60" y="675.5" font-size="12.8" fill="#18212b">TCP 443: optional local test against the Global Managers and the Local Managers (step 5).</text>
<circle cx="40" cy="698" r="11" fill="#18212b"/><text x="40" y="702.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="60" y="702.5" font-size="12.8" fill="#18212b">TCP 5000: the cloud proxy pulls the image (Option B).</text>
<circle cx="40" cy="725" r="11" fill="#18212b"/><text x="40" y="729.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="60" y="729.5" font-size="12.8" fill="#18212b">TCP 443: the cloud proxy pulls the image (Option A).</text>
<circle cx="40" cy="752" r="11" fill="#18212b"/><text x="40" y="756.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="60" y="756.5" font-size="12.8" fill="#18212b">TCP 443: collection.</text>
</svg>
