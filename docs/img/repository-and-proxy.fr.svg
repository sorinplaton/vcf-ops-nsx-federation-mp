<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 772" width="1232" height="772" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Ce qui entre dans votre dépôt et ce qui s&#x27;exécute sur le proxy cloud">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1232" height="772" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">Ce qui entre dans votre dépôt et ce qui s&#x27;exécute sur le proxy cloud</text>
<rect x="28" y="64" width="264" height="452" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="44" y="90" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">PUBLIÉ</text>
<text x="44" y="112" font-size="12" font-weight="600" fill="#5a6675" text-anchor="start" letter-spacing=".04em">DOCKER HUB ET GHCR.IO</text>
<rect x="44" y="132" width="232" height="88" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2" /><rect x="44" y="132" width="6" height="88" rx="3" fill="#57478c"/><text x="62" y="157" font-size="15" font-weight="600" fill="#18212b">Image du pack</text><text x="62" y="176" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation-pak:&lt;release&gt;</text><text x="62" y="192" font-size="12.3" fill="#5a6675" >le .pak dans une image</text><text x="62" y="208" font-size="12.3" fill="#5a6675" >construite FROM scratch</text>
<rect x="44" y="236" width="232" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="44" y="236" width="6" height="88" rx="3" fill="#b45309"/><text x="62" y="261" font-size="15" font-weight="600" fill="#18212b">Image de l&#x27;adaptateur</text><text x="62" y="280" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation@sha256:…</text><text x="62" y="296" font-size="12.3" fill="#5a6675" >le collecteur : Wolfi, Python,</text><text x="62" y="312" font-size="12.3" fill="#5a6675" >serveur du SDK, code</text>
<rect x="44" y="340" width="232" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" /><rect x="44" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="62" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="62" y="384" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">sha256-&lt;digest&gt;.sig et .att</text><text x="62" y="400" font-size="12.3" fill="#5a6675" >signature, SBOM et</text><text x="62" y="416" font-size="12.3" fill="#5a6675" >provenance de construction</text>
<rect x="316" y="64" width="520" height="452" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="332" y="90" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">VOTRE ARTIFACTORY</text>
<text x="332" y="112" font-size="12" font-weight="600" fill="#5a6675" text-anchor="start" letter-spacing=".04em">DISTANT : CACHE DE DOCKER HUB</text>
<text x="584" y="112" font-size="12" font-weight="600" fill="#0b5cad" text-anchor="start" letter-spacing=".04em">VCFOPS-APPROVED : LOCAL</text>
<rect x="332" y="132" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="132" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="157" font-size="15" font-weight="600" fill="#18212b">Image du pack</text><text x="350" y="176" font-size="12.3" fill="#5a6675" >en cache au premier accès</text>
<rect x="332" y="236" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="236" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="261" font-size="15" font-weight="600" fill="#18212b">Image de l&#x27;adaptateur</text><text x="350" y="280" font-size="12.3" fill="#5a6675" >en cache au premier accès</text>
<rect x="332" y="340" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="350" y="384" font-size="12.3" fill="#5a6675" >lues pour la vérification</text>
<rect x="584" y="132" width="236" height="88" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2" /><rect x="584" y="132" width="6" height="88" rx="3" fill="#57478c"/><text x="602" y="157" font-size="15" font-weight="600" fill="#18212b">Image du pack</text><text x="602" y="176" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation-pak:&lt;release&gt;</text><text x="602" y="192" font-size="12.3" fill="#5a6675" >.pak et SHA256SUMS,</text><text x="602" y="208" font-size="12.3" fill="#5a6675" >ne peut pas s&#x27;exécuter</text>
<rect x="584" y="236" width="236" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="584" y="236" width="6" height="88" rx="3" fill="#b45309"/><text x="602" y="261" font-size="15" font-weight="600" fill="#18212b">Image de l&#x27;adaptateur</text><text x="602" y="280" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation:&lt;release&gt;</text><text x="602" y="296" font-size="12.3" fill="#5a6675" >même digest que l&#x27;image publiée,</text><text x="602" y="312" font-size="12.3" fill="#5a6675" >environ 220 Mo</text>
<rect x="584" y="340" width="236" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="584" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="602" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="602" y="384" font-size="12.3" fill="#5a6675" >facultatif, avec cosign copy,</text><text x="602" y="400" font-size="12.3" fill="#5a6675" >pour revérifier plus tard</text>
<text x="332" y="462" font-size="12.3" fill="#5a6675">Entre les deux : les signatures sont vérifiées (étape 4 du guide) et les</text>
<text x="332" y="480" font-size="12.3" fill="#5a6675">images analysées (étape 5), puis copiées par digest (étape 6).</text>
<path d="M276,176.0 L328,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M532,176.0 L580,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M276,280.0 L328,280.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="300.0" cy="280.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="300.0" y="284.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M532,280.0 L580,280.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="554.0" cy="280.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="554.0" y="284.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M276,384.0 L328,384.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M532,384.0 L580,384.0" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<rect x="860" y="64" width="344" height="452" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="876" y="90" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">VOTRE SITE VCF OPERATIONS</text>
<rect x="880" y="132" width="304" height="88" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="880" y="132" width="6" height="88" rx="3" fill="#0b5cad"/><text x="898" y="157" font-size="15" font-weight="600" fill="#18212b">VCF Operations</text><text x="898" y="176" font-size="12.3" fill="#5a6675" >le .pak, pointé vers Artifactory :</text><text x="898" y="192" font-size="12.3" fill="#5a6675" >contenu, alertes, tableaux de bord</text><text x="898" y="208" font-size="12.3" fill="#5a6675" >et adresse de l&#x27;image de l&#x27;adaptateur</text>
<rect x="880" y="232" width="304" height="248" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="880" y="232" width="6" height="248" rx="3" fill="#1e7a50"/><text x="898" y="257" font-size="15" font-weight="600" fill="#18212b">Proxy cloud</text>
<rect x="898" y="270" width="270" height="112" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="898" y="270" width="6" height="112" rx="3" fill="#b45309"/><text x="916" y="295" font-size="15" font-weight="600" fill="#18212b">Conteneur de l&#x27;adaptateur</text><text x="916" y="314" font-size="12.3" fill="#5a6675" >l&#x27;image de l&#x27;adaptateur, par digest</text><text x="916" y="330" font-size="12.3" fill="#5a6675" >Wolfi · Python 3.11 · serveur du SDK</text><text x="916" y="346" font-size="12.3" fill="#5a6675" >paquets Python · code de l&#x27;adaptateur</text><text x="916" y="362" font-size="12.3" fill="#5a6675" >collecte NSX à chaque cycle</text>
<rect x="898" y="392" width="270" height="74" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" /><rect x="898" y="392" width="6" height="74" rx="3" fill="#5a6675"/><text x="916" y="417" font-size="15" font-weight="600" fill="#18212b">Certificat du registre</text><text x="916" y="436" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/docker/certs.d/…/ca.crt</text><text x="916" y="452" font-size="12.3" fill="#5a6675" >si Artifactory a une autorité interne</text>
<path d="M820,176.0 L876,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="846.0" cy="176.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="846.0" y="180.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M820,290 L894,290" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="855.0" cy="290.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="855.0" y="294.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="40" cy="548" r="11" fill="#18212b" /><text x="40" y="552.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="552.5" font-size="13.5" fill="#18212b">Artifactory récupère la version sur Docker Hub via son dépôt distant : deux images et leurs signatures.</text>
<circle cx="40" cy="574" r="11" fill="#18212b" /><text x="40" y="578.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="578.5" font-size="13.5" fill="#18212b">Après la vérification des signatures et l&#x27;analyse, les deux images sont copiées par digest dans vcfops-approved.</text>
<circle cx="40" cy="600" r="11" fill="#18212b" /><text x="40" y="604.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="604.5" font-size="13.5" fill="#18212b">Le .pak est sorti de l&#x27;image du pack, pointé vers Artifactory (repack.py) et téléversé dans VCF Operations.</text>
<circle cx="40" cy="626" r="11" fill="#18212b" /><text x="40" y="630.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="630.5" font-size="13.5" fill="#18212b">Au démarrage du compte, le proxy cloud récupère l&#x27;image de l&#x27;adaptateur par digest dans vcfops-approved et l&#x27;exécute.</text>
<rect x="28" y="664" width="1176" height="84" rx="10" fill="#fdf2f2" stroke="#e8c4c1"/><text x="46" y="690" font-size="14" font-weight="600" fill="#b3261e">Jamais sur le proxy cloud</text><text x="46" y="712" font-size="13" fill="#18212b">L&#x27;image du pack et le fichier .pak (le .pak va dans VCF Operations), les signatures, et l&#x27;étape de</text><text x="46" y="730" font-size="13" fill="#18212b">construction de l&#x27;image de l&#x27;adaptateur (Debian 12 et les outils du SDK).</text>
</svg>
