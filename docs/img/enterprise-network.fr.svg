<text x="28" y="512" font-size="13.5" font-weight="600" fill="#18212b">Flux réseau, tous en TCP 443. Chaque flèche part du système qui ouvre la connexion. Traits pleins : Artifactory et l&#x27;hôte de promotion. Pointillés :</text>
<text x="28" y="532" font-size="13.5" font-weight="600" fill="#18212b">le proxy cloud.</text>
<circle cx="40" cy="564" r="11" fill="#18212b"/><text x="40" y="568.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="568.5" font-size="12.8" fill="#18212b">Dépôt distant.</text>
<circle cx="40" cy="591" r="11" fill="#18212b"/><text x="40" y="595.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="595.5" font-size="12.8" fill="#18212b">Pull, push (étapes 3 à 7).</text>
