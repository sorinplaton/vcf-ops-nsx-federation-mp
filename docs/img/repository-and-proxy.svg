<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 754" width="1232" height="754" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="What goes into your repository and what runs on the cloud proxy">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1232" height="754" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">What goes into your repository and what runs on the cloud proxy</text>
<rect x="28" y="64" width="264" height="452" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="44" y="90" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">PUBLISHED</text>
<text x="44" y="112" font-size="12" font-weight="600" fill="#5a6675" text-anchor="start" letter-spacing=".04em">DOCKER HUB AND GHCR.IO</text>
<rect x="44" y="132" width="232" height="88" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2" /><rect x="44" y="132" width="6" height="88" rx="3" fill="#57478c"/><text x="62" y="157" font-size="15" font-weight="600" fill="#18212b">Pack image</text><text x="62" y="176" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation-pak:&lt;release&gt;</text><text x="62" y="192" font-size="12.3" fill="#5a6675" >the .pak in an image</text><text x="62" y="208" font-size="12.3" fill="#5a6675" >built FROM scratch</text>
<rect x="44" y="236" width="232" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="44" y="236" width="6" height="88" rx="3" fill="#b45309"/><text x="62" y="261" font-size="15" font-weight="600" fill="#18212b">Adapter image</text><text x="62" y="280" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation@sha256:…</text><text x="62" y="296" font-size="12.3" fill="#5a6675" >the collector: Wolfi, Python,</text><text x="62" y="312" font-size="12.3" fill="#5a6675" >SDK server, adapter code</text>
<rect x="44" y="340" width="232" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" /><rect x="44" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="62" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="62" y="384" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">sha256-&lt;digest&gt;.sig and .att</text><text x="62" y="400" font-size="12.3" fill="#5a6675" >signature, SBOM and</text><text x="62" y="416" font-size="12.3" fill="#5a6675" >build provenance</text>
<rect x="316" y="64" width="520" height="452" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="332" y="90" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">YOUR ARTIFACTORY</text>
<text x="332" y="112" font-size="12" font-weight="600" fill="#5a6675" text-anchor="start" letter-spacing=".04em">REMOTE: DOCKER HUB CACHE</text>
<text x="584" y="112" font-size="12" font-weight="600" fill="#0b5cad" text-anchor="start" letter-spacing=".04em">VCFOPS-APPROVED: LOCAL</text>
<rect x="332" y="132" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="132" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="157" font-size="15" font-weight="600" fill="#18212b">Pack image</text><text x="350" y="176" font-size="12.3" fill="#5a6675" >cached on first pull</text>
<rect x="332" y="236" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="236" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="261" font-size="15" font-weight="600" fill="#18212b">Adapter image</text><text x="350" y="280" font-size="12.3" fill="#5a6675" >cached on first pull</text>
<rect x="332" y="340" width="200" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="332" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="350" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="350" y="384" font-size="12.3" fill="#5a6675" >read in the check</text>
<rect x="584" y="132" width="236" height="88" rx="10" fill="#ffffff" stroke="#57478c" stroke-width="2" /><rect x="584" y="132" width="6" height="88" rx="3" fill="#57478c"/><text x="602" y="157" font-size="15" font-weight="600" fill="#18212b">Pack image</text><text x="602" y="176" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation-pak:&lt;release&gt;</text><text x="602" y="192" font-size="12.3" fill="#5a6675" >.pak and SHA256SUMS,</text><text x="602" y="208" font-size="12.3" fill="#5a6675" >cannot run</text>
<rect x="584" y="236" width="236" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="584" y="236" width="6" height="88" rx="3" fill="#b45309"/><text x="602" y="261" font-size="15" font-weight="600" fill="#18212b">Adapter image</text><text x="602" y="280" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">nsxfederation:&lt;release&gt;</text><text x="602" y="296" font-size="12.3" fill="#5a6675" >same digest as published,</text><text x="602" y="312" font-size="12.3" fill="#5a6675" >about 220 MB</text>
<rect x="584" y="340" width="236" height="88" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><rect x="584" y="340" width="6" height="88" rx="3" fill="#5a6675"/><text x="602" y="365" font-size="15" font-weight="600" fill="#18212b">Signatures</text><text x="602" y="384" font-size="12.3" fill="#5a6675" >optional, with cosign copy,</text><text x="602" y="400" font-size="12.3" fill="#5a6675" >to check again later</text>
<text x="332" y="462" font-size="12.3" fill="#5a6675">Between the two: the signatures are checked (step 4) and the images</text>
<text x="332" y="480" font-size="12.3" fill="#5a6675">scanned (step 5), then both are copied by digest (step 6).</text>
<path d="M276,176.0 L328,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M532,176.0 L580,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M276,280.0 L328,280.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="300.0" cy="280.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="300.0" y="284.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M532,280.0 L580,280.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="554.0" cy="280.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="554.0" y="284.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<path d="M276,384.0 L328,384.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<path d="M532,384.0 L580,384.0" fill="none" stroke="#18212b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<rect x="860" y="64" width="344" height="452" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="876" y="90" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">YOUR VCF OPERATIONS SITE</text>
<rect x="880" y="132" width="304" height="88" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="880" y="132" width="6" height="88" rx="3" fill="#0b5cad"/><text x="898" y="157" font-size="15" font-weight="600" fill="#18212b">VCF Operations</text><text x="898" y="176" font-size="12.3" fill="#5a6675" >the .pak, pointed at Artifactory:</text><text x="898" y="192" font-size="12.3" fill="#5a6675" >content, alerts, dashboards and</text><text x="898" y="208" font-size="12.3" fill="#5a6675" >the address of the adapter image</text>
<rect x="880" y="232" width="304" height="248" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><rect x="880" y="232" width="6" height="248" rx="3" fill="#1e7a50"/><text x="898" y="257" font-size="15" font-weight="600" fill="#18212b">Cloud proxy</text>
<rect x="898" y="270" width="270" height="112" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" /><rect x="898" y="270" width="6" height="112" rx="3" fill="#b45309"/><text x="916" y="295" font-size="15" font-weight="600" fill="#18212b">Adapter container</text><text x="916" y="314" font-size="12.3" fill="#5a6675" >the adapter image, pulled by digest</text><text x="916" y="330" font-size="12.3" fill="#5a6675" >Wolfi · Python 3.11 · SDK server</text><text x="916" y="346" font-size="12.3" fill="#5a6675" >Python packages · adapter code</text><text x="916" y="362" font-size="12.3" fill="#5a6675" >collects from NSX every cycle</text>
<rect x="898" y="392" width="270" height="74" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2" /><rect x="898" y="392" width="6" height="74" rx="3" fill="#5a6675"/><text x="916" y="417" font-size="15" font-weight="600" fill="#18212b">Registry certificate</text><text x="916" y="436" font-size="11.3" fill="#5a6675" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/docker/certs.d/…/ca.crt</text><text x="916" y="452" font-size="12.3" fill="#5a6675" >only if Artifactory has an internal CA</text>
<path d="M820,176.0 L876,176.0" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="846.0" cy="176.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="846.0" y="180.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M820,290 L894,290" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/><circle cx="855.0" cy="290.0" r="12" fill="#18212b" stroke="#ffffff" stroke-width="2.5"/><text x="855.0" y="294.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="40" cy="548" r="11" fill="#18212b" /><text x="40" y="552.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="60" y="552.5" font-size="13.5" fill="#18212b">Artifactory pulls the release from Docker Hub through its remote repository: two images and their signatures.</text>
<circle cx="40" cy="574" r="11" fill="#18212b" /><text x="40" y="578.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="60" y="578.5" font-size="13.5" fill="#18212b">After the signature check and the scan, both images are copied by digest into vcfops-approved.</text>
<circle cx="40" cy="600" r="11" fill="#18212b" /><text x="40" y="604.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="60" y="604.5" font-size="13.5" fill="#18212b">The .pak is taken out of the pack image, pointed at Artifactory (repack.py) and uploaded to VCF Operations.</text>
<circle cx="40" cy="626" r="11" fill="#18212b" /><text x="40" y="630.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="60" y="630.5" font-size="13.5" fill="#18212b">When the account starts, the cloud proxy pulls the adapter image by digest from vcfops-approved and runs it.</text>
<rect x="28" y="664" width="1176" height="66" rx="10" fill="#fdf2f2" stroke="#e8c4c1"/><text x="46" y="690" font-size="14" font-weight="600" fill="#b3261e">Never on the cloud proxy</text><text x="46" y="712" font-size="13" fill="#18212b">The pack image and the .pak file (the .pak goes to VCF Operations), the signatures, and the build stage of the adapter image (Debian 12 and the SDK tools).</text>
</svg>
