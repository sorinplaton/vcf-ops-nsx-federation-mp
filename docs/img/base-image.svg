<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="The adapter image on Debian 12 and on Wolfi">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18212b"/></marker></defs>
<rect width="1120" height="590" rx="14" fill="#ffffff" stroke="#c9d1db"/>
<text x="28" y="40" font-size="20" font-weight="600" fill="#18212b">The adapter image on Debian 12 and on Wolfi</text>
<rect x="28" y="64" width="330" height="412" rx="12" fill="#fbf6ec" stroke="#e6d9bd"/><text x="44" y="90" font-size="13" font-weight="600" fill="#9a5b00" letter-spacing=".06em">UP TO 1.13.6: ONE STAGE</text>
<text x="193" y="118" font-size="12" font-weight="600" fill="#9a5b00" text-anchor="middle" letter-spacing=".04em">THE WHOLE IMAGE IS SHIPPED</text>
<rect x="48" y="132" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="48" y="132" width="6" height="58" rx="3" fill="#0b5cad"/><text x="66" y="157" font-size="15" font-weight="600" fill="#18212b">Adapter code</text><text x="66" y="176" font-size="12.3" fill="#5a6675" >this repository</text>
<rect x="48" y="198" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="48" y="198" width="6" height="58" rx="3" fill="#0b5cad"/><text x="66" y="223" font-size="15" font-weight="600" fill="#18212b">Python packages</text><text x="66" y="242" font-size="12.3" fill="#5a6675" >the SDK server and the adapter&#x27;s, locked</text>
<rect x="48" y="264" width="290" height="92" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2" /><rect x="48" y="264" width="6" height="92" rx="3" fill="#b3261e"/><text x="66" y="289" font-size="15" font-weight="600" fill="#18212b">Debian 12</text><text x="66" y="308" font-size="12.3" fill="#5a6675" >the SDK&#x27;s base-adapter image:</text><text x="66" y="324" font-size="12.3" fill="#5a6675" >a full operating system, with its</text><text x="66" y="340" font-size="12.3" fill="#5a6675" >package tools and system libraries</text>
<rect x="48" y="394" width="290" height="62" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="193.0" y="422" font-size="19" font-weight="700" fill="#b3261e" text-anchor="middle">102 HIGH or CRITICAL</text><text x="193.0" y="443" font-size="12.5" fill="#5a6675" text-anchor="middle">no fixed version in Debian 12 · 405 MB</text>
<rect x="386" y="64" width="706" height="412" rx="12" fill="#f4f7fb" stroke="#d5deea"/><text x="402" y="90" font-size="13" font-weight="600" fill="#0b5cad" letter-spacing=".06em">FROM 1.13.7: TWO STAGES</text>
<text x="551" y="118" font-size="12" font-weight="600" fill="#5a6675" text-anchor="middle" letter-spacing=".04em">STAGE 1 · BUILD ONLY, NOT SHIPPED</text>
<text x="927" y="118" font-size="12" font-weight="600" fill="#1e7a50" text-anchor="middle" letter-spacing=".04em">STAGE 2 · SHIPPED</text>
<rect x="406" y="132" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" stroke-dasharray="6 5"/><rect x="406" y="132" width="6" height="58" rx="3" fill="#0b5cad"/><text x="424" y="157" font-size="15" font-weight="600" fill="#18212b">Adapter code</text><text x="424" y="176" font-size="12.3" fill="#5a6675" >this repository</text>
<rect x="406" y="198" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" stroke-dasharray="6 5"/><rect x="406" y="198" width="6" height="58" rx="3" fill="#0b5cad"/><text x="424" y="223" font-size="15" font-weight="600" fill="#18212b">Python packages</text><text x="424" y="242" font-size="12.3" fill="#5a6675" >the SDK server and the adapter&#x27;s, locked</text>
<rect x="406" y="264" width="290" height="92" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 5"/><rect x="406" y="264" width="6" height="92" rx="3" fill="#b3261e"/><text x="424" y="289" font-size="15" font-weight="600" fill="#18212b">Debian 12</text><text x="424" y="308" font-size="12.3" fill="#5a6675" >the SDK&#x27;s base-adapter image,</text><text x="424" y="324" font-size="12.3" fill="#5a6675" >unchanged: mp-build builds here</text><text x="424" y="340" font-size="12.3" fill="#5a6675" >as the SDK expects</text>
<rect x="782" y="132" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="782" y="132" width="6" height="58" rx="3" fill="#0b5cad"/><text x="800" y="157" font-size="15" font-weight="600" fill="#18212b">Adapter code</text><text x="800" y="176" font-size="12.3" fill="#5a6675" >the same files</text>
<rect x="782" y="198" width="290" height="58" rx="10" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><rect x="782" y="198" width="6" height="58" rx="3" fill="#0b5cad"/><text x="800" y="223" font-size="15" font-weight="600" fill="#18212b">Python packages</text><text x="800" y="242" font-size="12.3" fill="#5a6675" >the same files</text>
<rect x="782" y="264" width="290" height="92" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2" /><rect x="782" y="264" width="6" height="92" rx="3" fill="#1e7a50"/><text x="800" y="289" font-size="15" font-weight="600" fill="#18212b">Wolfi</text><text x="800" y="308" font-size="12.3" fill="#5a6675" >pinned by digest: Python 3.11</text><text x="800" y="324" font-size="12.3" fill="#5a6675" >and the few libraries it needs,</text><text x="800" y="340" font-size="12.3" fill="#5a6675" >nothing else</text>
<path d="M696,161 L778,161" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<text x="737" y="152" font-size="12" fill="#18212b" text-anchor="middle">copied</text>
<path d="M696,227 L778,227" fill="none" stroke="#18212b" stroke-width="2"  marker-end="url(#a)"/>
<text x="737" y="218" font-size="12" fill="#18212b" text-anchor="middle">copied</text>
<text x="739" y="306" font-size="12" fill="#b3261e" text-anchor="middle">left</text>
<text x="739" y="322" font-size="12" fill="#b3261e" text-anchor="middle">behind</text>
<rect x="406" y="394" width="290" height="62" rx="10" fill="#ffffff" stroke="#5a6675" stroke-width="2"/><text x="551.0" y="422" font-size="19" font-weight="700" fill="#5a6675" text-anchor="middle">Stays on the build host</text><text x="551.0" y="443" font-size="12.5" fill="#5a6675" text-anchor="middle">its findings do not reach the cloud proxy</text>
<rect x="782" y="394" width="290" height="62" rx="10" fill="#ffffff" stroke="#1e7a50" stroke-width="2"/><text x="927.0" y="422" font-size="19" font-weight="700" fill="#1e7a50" text-anchor="middle">No finding</text><text x="927.0" y="443" font-size="12.5" fill="#5a6675" text-anchor="middle">Trivy report of 1.13.7 · about 220 MB</text>
<rect x="28" y="506" width="26" height="16" rx="4" fill="#ffffff" stroke="#0b5cad" stroke-width="2" /><text x="64" y="519" font-size="12.5" fill="#18212b">The same in every release</text>
<rect x="294" y="506" width="26" height="16" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2" /><text x="330" y="519" font-size="12.5" fill="#18212b">Debian 12, the SDK&#x27;s base</text>
<rect x="560" y="506" width="26" height="16" rx="4" fill="#ffffff" stroke="#1e7a50" stroke-width="2" /><text x="596" y="519" font-size="12.5" fill="#18212b">Wolfi, the base that ships</text>
<rect x="826" y="506" width="26" height="16" rx="4" fill="#ffffff" stroke="#5a6675" stroke-width="2" stroke-dasharray="6 5"/><text x="862" y="519" font-size="12.5" fill="#18212b">Build stage, not shipped</text>
<text x="28" y="556" font-size="12" fill="#5a6675">Figures: Trivy reports of releases 1.13.5 (Debian 12) and 1.13.7 (Wolfi), HIGH and CRITICAL findings; image sizes as in the changelog.</text>
</svg>
