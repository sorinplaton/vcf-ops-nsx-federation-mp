<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 793" width="1100" height="793" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img" aria-label="Option B : flux réseau de l&#x27;hôte de construction et du proxy cloud">
