name: release
# Git is the single source of truth: a tag v* builds the pack and the adapter image from that tag and publishes them.
#
# build   (pull requests): the same build against a throwaway registry, read-only token, nothing pushed or signed.
#         Shows that the pack still builds and that the adapter image has no CRITICAL vulnerability with a fix.
# release (tags v*): runs in the environment "release", which waits for the maintainer's approval and alone holds
#         DOCKERHUB_TOKEN. Builds, pushes to ghcr.io, signs keyless (Sigstore: the certificate names this workflow and
#         the tag), attests the build provenance (SLSA) and the SBOM, copies both images byte for byte to Docker Hub
#         and signs the copies, verifies everything as a user would, and creates a DRAFT release (docs/RELEASE.md).
# Actions are pinned by commit SHA; Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pack/**"
      - "tooling/**"
      - "pak-image/**"
      - ".github/actions/build-pack/**"
      - ".github/workflows/release.yml"

permissions: {}

env:
  COSIGN_VERSION: v2.4.1
  IMAGE: ghcr.io/sorinplaton/nsxfederation
  PAK_IMAGE: ghcr.io/sorinplaton/nsxfederation-pak
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-pack
        with:
          registry: localhost:5000/nsxfederation
          pak-image: localhost:5000/nsxfederation-pak:pr
          release: 0.0.0-pr${{ github.event.pull_request.number }}

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the draft release
      packages: write       # push to ghcr.io with GITHUB_TOKEN
      id-token: write       # keyless signing and attestations: OIDC token for Sigstore
      attestations: write   # build provenance in the GitHub attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Settings for this release
        id: s
        run: |
          echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "signer=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"

      - id: b
        uses: ./.github/actions/build-pack
        with:
          registry: ghcr.io/sorinplaton/nsxfederation
          pak-image: ghcr.io/sorinplaton/nsxfederation-pak:${{ steps.s.outputs.release }}
          release: ${{ steps.s.outputs.release }}
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: The pack names ghcr.io
        env:
          REG: ${{ steps.b.outputs.registry-in-pack }}
        run: '[ "$REG" = ghcr.io ] || { echo "::error::the pack names $REG, expected ghcr.io"; exit 1; }'

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign keyless, attach the SBOM as a signed attestation
        env:
          AD: ${{ steps.b.outputs.digest }}
          PK: ${{ steps.b.outputs.pak-digest }}
          V: ${{ steps.b.outputs.version }}
        run: |
          cosign sign --yes "$IMAGE@$AD"
          cosign sign --yes "$PAK_IMAGE@$PK"
          cosign attest --yes --type cyclonedx --predicate "pack/build/NSXFederation_$V.sbom.cdx.json" "$IMAGE@$AD"
          cd pack/build
          sha256sum "NSXFederation_$V.pak" > "NSXFederation_$V.pak.sha256"
          cosign sign-blob --yes --bundle "NSXFederation_$V.pak.sigstore.json" "NSXFederation_$V.pak"

      - name: Build provenance of the pack (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: pack/build/NSXFederation_${{ steps.b.outputs.version }}.pak
      - name: Build provenance of the adapter image (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/sorinplaton/nsxfederation
          subject-digest: ${{ steps.b.outputs.digest }}
          push-to-registry: true
      - name: Build provenance of the pack image (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/sorinplaton/nsxfederation-pak
          subject-digest: ${{ steps.b.outputs.pak-digest }}
          push-to-registry: true

      - name: Verify as a user would
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.s.outputs.signer }}
          AD: ${{ steps.b.outputs.digest }}
          PK: ${{ steps.b.outputs.pak-digest }}
          V: ${{ steps.b.outputs.version }}
        run: |
          cosign verify --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$AD" > /dev/null
          cosign verify --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$PAK_IMAGE@$PK" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$AD" > /dev/null
          gh attestation verify "oci://$IMAGE@$AD" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "oci://$PAK_IMAGE@$PK" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          cd pack/build
          gh attestation verify "NSXFederation_$V.pak" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          cosign verify-blob --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" \
            --bundle "NSXFederation_$V.pak.sigstore.json" "NSXFederation_$V.pak"
          sha256sum -c "NSXFederation_$V.pak.sha256"

      # Docker Hub copy, for sites whose Artifactory (or other registry) proxies Docker Hub. Byte for byte, so the
      # digests are the same as on ghcr.io, and the provenance in the GitHub attestation store applies to both. Runs
      # when the variable DOCKERHUB_NAMESPACE and the environment secret DOCKERHUB_TOKEN are set (docs/RELEASE.md).
      - name: Copy both images to Docker Hub, sign the copies, attach the SBOM
        id: hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          HUB_USER: ${{ vars.DOCKERHUB_USER || vars.DOCKERHUB_NAMESPACE }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.s.outputs.signer }}
          AD: ${{ steps.b.outputs.digest }}
          PK: ${{ steps.b.outputs.pak-digest }}
          R: ${{ steps.s.outputs.release }}
          V: ${{ steps.b.outputs.version }}
        run: |
          SRC="--src-creds ${{ github.actor }}:$GH_TOKEN"
          DST="--dest-creds $HUB_USER:$HUB_TOKEN"
          skopeo copy --all --preserve-digests $SRC $DST "docker://$IMAGE@$AD" "docker://docker.io/$NS/nsxfederation:$R"
          skopeo copy --all --preserve-digests $SRC $DST "docker://$PAK_IMAGE@$PK" "docker://docker.io/$NS/nsxfederation-pak:$R"
          echo "$HUB_TOKEN" | docker login docker.io -u "$HUB_USER" --password-stdin
          cosign sign --yes "docker.io/$NS/nsxfederation@$AD"
          cosign sign --yes "docker.io/$NS/nsxfederation-pak@$PK"
          cosign attest --yes --type cyclonedx --predicate "pack/build/NSXFederation_$V.sbom.cdx.json" "docker.io/$NS/nsxfederation@$AD"
          for ref in "docker.io/$NS/nsxfederation@$AD" "docker.io/$NS/nsxfederation-pak@$PK"; do
            cosign verify --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            gh attestation verify "oci://$ref" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
          done
          docker logout docker.io
          { echo "| Adapter image, Docker Hub | \`docker.io/$NS/nsxfederation@$AD\` |"
            echo "| Pack image, Docker Hub | \`docker.io/$NS/nsxfederation-pak:$R\` |"; } > /tmp/hub_rows.md

      - name: Docker Hub description from the repository
        if: steps.hub.outcome == 'success'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USER || vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/nsxfederation-pak
          short-description: "NSX Federation management pack (.pak) for VCF Operations, from GitHub releases"
          readme-filepath: pak-image/DOCKERHUB.md

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.s.outputs.signer }}
          AD: ${{ steps.b.outputs.digest }}
          PK: ${{ steps.b.outputs.pak-digest }}
          R: ${{ steps.s.outputs.release }}
          V: ${{ steps.b.outputs.version }}
        run: |
          cat > /tmp/notes.md <<NOTES
          Pack \`NSXFederation_$V.pak\` (pack version $V).

          | Item | Value |
          | --- | --- |
          | Adapter image | \`$IMAGE@$AD\` |
          | Pack image | \`$PAK_IMAGE:$R\` (\`$PK\`) |
          $(cat /tmp/hub_rows.md 2>/dev/null)
          | Keyless signer | \`$ID\` |
          | OIDC issuer | \`$ISSUER\` |

          Every image and the pack also carry a build provenance attestation (\`gh attestation verify\`), and the
          adapter image a signed CycloneDX SBOM (\`cosign verify-attestation --type cyclonedx\`). The vulnerability scan
          of the adapter image is \`NSXFederation_$V.trivy.txt\`.

          Install: [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md).
          Enterprise registry (Artifactory): [docs/INSTALL-ENTERPRISE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL-ENTERPRISE.md).
          NOTES
          cd pack/build
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$R" --notes-file /tmp/notes.md \
            "NSXFederation_$V.pak" "NSXFederation_$V.pak.sha256" "NSXFederation_$V.pak.sigstore.json" \
            "NSXFederation_$V.sbom.cdx.json" "NSXFederation_$V.trivy.txt" "NSXFederation_$V.trivy.json"
