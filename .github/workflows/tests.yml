name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pack/adapter_requirements.txt requests lxml pytest pillow
      - name: Generated content is up to date
        run: |
          for g in alerts dashboards groups views; do python tools/gen_$g.py; done
          git diff --exit-code pack/content
      - run: python -m pytest -q tests
