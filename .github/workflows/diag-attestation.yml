name: diag-attestation
# Temporary: find why gh attestation verify fails on the runner (release v1.13.4). Read-only.
on:
  pull_request:
    paths: [".github/workflows/diag-attestation.yml"]
permissions:
  contents: read
  attestations: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMG: ghcr.io/sorinplaton/nsxfederation@sha256:3ee9f28b0d51270ef09ea7a41a652efc3cfa0163c921193bfb951cc69a978dc1
      R: sorinplaton/vcf-ops-nsx-federation-mp
    steps:
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: v2.4.1
      - name: A. cosign 2.4.1 first, then gh
        id: a
        continue-on-error: true
        run: |
          cosign verify --certificate-identity "https://github.com/$R/.github/workflows/release.yml@refs/tags/v1.13.4" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMG" > /dev/null && echo "cosign OK"
          ls -la ~/.sigstore ~/.sigstore/root 2>&1 | head -8
          gh attestation verify "oci://$IMG" -R "$R" --signer-workflow "$R/.github/workflows/release.yml"
      - name: B. gh with its own HOME after cosign
        id: b
        continue-on-error: true
        run: |
          H=$(mktemp -d)
          HOME=$H gh attestation verify "oci://$IMG" -R "$R" --signer-workflow "$R/.github/workflows/release.yml"
      - name: C. gh after removing ~/.sigstore
        id: c
        continue-on-error: true
        run: |
          rm -rf ~/.sigstore
          gh attestation verify "oci://$IMG" -R "$R" --signer-workflow "$R/.github/workflows/release.yml"
      - name: Outcomes
        run: echo "A=${{ steps.a.outcome }} B=${{ steps.b.outcome }} C=${{ steps.c.outcome }}"
